<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karategata Banking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <div class="bank-name" data-i18n="bankName">空手形銀行</div>
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-ja" class="lang-btn">日本語</button>
        <button id="lang-en" class="lang-btn">English</button>
      </div>
    </div>
  </header>

  <div class="demo-bar"><div class="wrap" data-i18n="ribbon">DEMO</div></div>

  <main class="wrap">
    <h1 data-i18n="paymentTitle">振込内容</h1>

    <section class="transfer" aria-labelledby="transfer-title">
      <dl class="kv">
        <dt data-i18n="payee">送金先</dt><dd id="expected-payee">Karategata Demo Shop</dd>
        <dt data-i18n="account">口座</dt><dd id="expected-account">KBC-0001</dd>
        <dt data-i18n="amount">金額</dt><dd><span id="expected-amount">¥1,000</span> <small data-i18n="amountUsd">(約 10 USD)</small></dd>
      </dl>
      <div class="actions">
        <button id="quote-btn" type="button" class="primary" data-i18n="quoteBtn">内容を確認</button>
        <button id="pay-btn" type="button" class="secondary" disabled data-i18n="payBtn">送金する</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>

      <div id="received" class="received hidden">
        <h2 data-i18n="receivedTitle">受信した内容</h2>
        <dl class="kv">
          <dt data-i18n="payee">送金先</dt><dd id="recv-payee">-</dd>
          <dt data-i18n="account">口座</dt><dd id="recv-account">-</dd>
          <dt data-i18n="amount">金額</dt><dd id="recv-amount">-</dd>
        </dl>
      </div>
    </section>

    <section id="danger" class="notice danger hidden" role="alert">
      <p class="danger-line" data-i18n="dangerDns">なんてこった！あなたのDNSは汚染されているため偽造された通信経路を踏んでいる！</p>
    </section>

    <section id="safe" class="notice safe hidden" role="status">
      <p data-i18n="safeBody">証明書の検証に失敗しました。</p>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
