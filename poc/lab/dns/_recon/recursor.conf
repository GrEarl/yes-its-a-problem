# PowerDNS Recursor 5.x (YAML-style config) lab settings
incoming:
  listen:
    - 0.0.0.0:53
  allow_from:
    - 0.0.0.0/0
recursor:
  daemon: false
  socket_dir: /var/run/pdns-recursor
  forward_zones:
    - zone: alpha.test
      forwarders:
        - 10.200.0.5
    - zone: beta.test
      forwarders:
        - 10.200.0.6
dnssec:
  validation: "off"
