options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { any; };
    recursion yes;
    allow-recursion { any; };
    dnssec-validation no;
    empty-zones-enable no;
};

zone "alpha.test" {
    type stub;
    masters { 10.200.0.5; };
    file "stub-alpha.test";
};

zone "beta.test" {
    type forward;
    forward only;
    forwarders { 10.200.0.6; };
};
