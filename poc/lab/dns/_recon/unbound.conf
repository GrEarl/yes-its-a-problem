server:
    interface: 0.0.0.0
    port: 53
    access-control: 0.0.0.0/0 allow
    username: ""
    do-ip6: no
    hide-identity: yes
    aggressive-nsec: no
    # RFC 6761 special-use TLD: unbound serves "test." as a local static
    # zone (NXDOMAIN) by default, shadowing stub/forward zones under *.test.
    local-zone: "test." transparent

stub-zone:
    name: "alpha.test"
    stub-addr: 10.200.0.5
    stub-prime: no

forward-zone:
    name: "beta.test"
    forward-addr: 10.200.0.6
